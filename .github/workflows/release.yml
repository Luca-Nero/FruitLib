# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Package
        run: |
          mkdir release
          cp bin/Release/net2.1/*.dll release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dll
          generate_release_notes: true
          previous_tag_name: v0.1.0-baseline