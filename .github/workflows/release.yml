# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0

      - name: Checkout ModRefs
        uses: actions/checkout@v4
        with:
          repository: Luca-Nero/ModRefs
          token: ${{ secrets.MODREFS_PAT }}
          path: ModRefs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: main
        run: dotnet restore

      - name: Build
        working-directory: main
        run: dotnet build --configuration Release --no-restore

      - name: Package
        working-directory: main
        run: |
          mkdir release
          cp bin/Release/*/*.dll release/
          
      - name: Generate Changelog
        shell: pwsh
        working-directory: main
        run: |
          $current = "${{ github.ref_name }}"

          $previous = git tag --merged $current |
            Where-Object {
              $_ -match '^v\d+\.\d+\.\d+$' -and
              [version]($_ -replace '^v', '') -lt [version]($current -replace '^v', '')
            } |
            Sort-Object { [version]($_ -replace '^v', '') } -Descending |
            Select-Object -First 1

          if ($previous) {
            $commits = git log "$previous..$current" --pretty=format:"- %s"
          } else {
            $commits = git log $current --pretty=format:"- %s"
          }

          $notes = @(
            "## Changes in $current"
            ""
            $commits
          )

    $notes | Set-Content release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: main/release/*.dll
          body_path: main/release-notes.md